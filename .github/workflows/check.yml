name: Plugin source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make check
      - name: Native qualification status
        run: echo 'Native Omarchy acceptance is a separate recorded gate. No release has been made.'
